<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Potê Batata F05 — verificação comercial sem baixa</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#101820;color:#fff;font:16px system-ui;max-width:680px;margin:10vh auto;padding:24px}button{padding:15px 20px;border-radius:12px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h2>F05 — verificação sem alterar estoque</h2><p>Confirma a autenticação Firebase e a comunicação com o Worker comercial. A solicitação usa um ID de ingrediente inexistente; nenhuma baixa válida será efetuada.</p><button id="check">Entrar com Google e verificar</button><p id="status">Aguardando</p><pre id="result"></pre><script type="module">import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";import {getAuth,signInWithPopup,GoogleAuthProvider} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";const app=initializeApp({apiKey:"AIzaSyCG8KCd6LKhYOIH3eLxifoT7IC9k3oMYCk",authDomain:"potobatata-b71f3.firebaseapp.com",projectId:"potobatata-b71f3",appId:"1:947524221002:web:ece242260f26bb46418eb3"});const auth=getAuth(app),status=document.querySelector("#status"),output=document.querySelector("#result");document.querySelector("#check").onclick=async()=>{status.textContent="Autenticando no Firebase comercial...";try{let user=auth.currentUser;if(!user)user=(await signInWithPopup(auth,new GoogleAuthProvider())).user;if(user.email!=="pixmcp@gmail.com")throw Error("Este ensaio exige a conta administradora");const token=await user.getIdToken();status.textContent="Testando chamada sem baixa...";const res=await fetch("https://pote-batata-f05-live.pixmcp.workers.dev/v1/inventory/adjust",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({universe:"batataria",operationId:"f05-prod-no-stock-probe-20261120-001",group:"ingredients",itemId:"__F05_PROBE_NONEXISTENT_20261120__",delta:-1,reason:"loss",lossReason:"vencimento",note:"Verificação sem alteração de estoque"})});const payload=await res.json();status.textContent=res.status===404&&payload.error==="stock_item_missing"?"PASS — autenticação e servidor válidos, sem baixa":"HTTP "+res.status+" — verificação pendente";output.textContent=JSON.stringify({http:res.status,code:payload.error||null,semBaixa:res.status!==200},null,2);}catch(e){status.textContent="Falha da autenticação QA: "+(e.code||"");output.textContent=e.message;}};</script></body></html>
