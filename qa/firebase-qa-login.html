<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Potê Batata QA - Login isolado</title><style>body{font:16px system-ui;background:#101820;color:white;max-width:720px;margin:8vh auto;padding:24px}button{padding:14px 22px;margin:8px;border-radius:10px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#9ca3af}</style></head><body><h1>Potê Batata — QA isolado</h1><p>Este teste usa somente o projeto <b>pote-batata-qa-worker</b>. Não acessa dados comerciais.</p><button id="login">Entrar com Google</button><button id="logout" disabled>Sair</button><p id="status">Aguardando autenticação</p><p><small>Não compartilhe tokens de acesso. Esta página não exibe tokens.</small></p><pre id="info"></pre><script type="module">import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";import {getAuth,GoogleAuthProvider,signInWithPopup,signOut} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";const app=initializeApp({projectId:"pote-batata-qa-worker",appId:"1:628477051231:web:b28bd12ddd8f362c02b6ea",apiKey:"AIzaSyAhtTs7zckfgN9XDJvemMUx_5tsi3PXMGQ",authDomain:"pote-batata-qa-worker.firebaseapp.com"});const auth=getAuth(app);const status=document.querySelector("#status"),info=document.querySelector("#info");document.querySelector("#login").onclick=async()=>{status.textContent="Abrindo Google...";try{const r=await signInWithPopup(auth,new GoogleAuthProvider());status.textContent="Autenticado no Firebase QA";info.textContent="UID QA: "+r.user.uid+"\nE-mail: "+r.user.email+"\nToken não exibido";document.querySelector("#logout").disabled=false;}catch(e){status.textContent="Falha: "+e.code;info.textContent=e.message;}};document.querySelector("#logout").onclick=async()=>{await signOut(auth);status.textContent="Desconectado";info.textContent="";};</script></body></html>
