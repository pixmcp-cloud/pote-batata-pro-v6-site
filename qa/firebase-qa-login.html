<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Potê Batata QA - Login isolado</title><style>body{font:16px system-ui;background:#101820;color:white;max-width:720px;margin:8vh auto;padding:24px}button{padding:14px 22px;margin:8px;border-radius:10px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#9ca3af}</style></head><body><h1>Potê Batata — QA isolado</h1><p>Este teste usa somente o projeto <b>pote-batata-qa-worker</b>. Não acessa dados comerciais.</p><button id="login">Entrar com Google</button><button id="logout" disabled>Sair</button><button id="loss" disabled>Testar perda QA (7 g)</button><p id="status">Aguardando autenticação</p><p><small>Não compartilhe tokens de acesso. Esta página não exibe tokens.</small></p><pre id="info"></pre><script type="module">import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";const app=initializeApp({projectId:"pote-batata-qa-worker",appId:"1:628477051231:web:b28bd12ddd8f362c02b6ea",apiKey:"AIzaSyAhtTs7zckfgN9XDJvemMUx_5tsi3PXMGQ",authDomain:"pote-batata-qa-worker.firebaseapp.com"});const auth=getAuth(app);const status=document.querySelector("#status"),info=document.querySelector("#info");onAuthStateChanged(auth,user=>{document.querySelector("#loss").disabled=!user;document.querySelector("#logout").disabled=!user;if(user){status.textContent="Autenticado no Firebase QA";info.textContent="UID QA: "+user.uid+"\\nToken não exibido";}});document.querySelector("#login").onclick=async()=>{status.textContent="Abrindo Google...";try{const r=await signInWithPopup(auth,new GoogleAuthProvider());status.textContent="Autenticado no Firebase QA";info.textContent="UID QA: "+r.user.uid+"\nE-mail: "+r.user.email+"\nToken não exibido";document.querySelector("#logout").disabled=false;document.querySelector("#loss").disabled=false;}catch(e){status.textContent="Falha: "+e.code;info.textContent=e.message;}};document.querySelector("#loss").onclick=async()=>{const user=auth.currentUser;if(!user){status.textContent="Faça login primeiro";return;}const operationId="f05-qa-live-20261120-stock00001";const body={universe:"qa",operationId,group:"ingredients",itemId:"potato",delta:-7,reason:"loss",note:"QA synthetic loss"};status.textContent="Executando perda QA...";try{const token=await user.getIdToken();const res=await fetch("https://pote-batata-guard-qa.pixmcp.workers.dev/v1/inventory/adjust",{method:"POST",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify(body)});const payload=await res.json();status.textContent="HTTP "+res.status+" | "+(payload.ok?"Teste de perda respondido":"Falha");info.textContent="Resultado: "+JSON.stringify(payload,null,2)+"\\nToken não exibido";}catch(e){status.textContent="Erro de rede QA";info.textContent=e.message;}};document.querySelector("#logout").onclick=async()=>{await signOut(auth);status.textContent="Desconectado";info.textContent="";};</script></body></html>
