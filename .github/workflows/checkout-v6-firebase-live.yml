name: V6 Checkout - retestar transporte Firestore sem redirects
on:
  push:
    branches: [feat/v6-geoapify-qa-20261125]
    paths: ['.github/workflows/checkout-v6-firebase-live.yml']
permissions:
  contents: read
concurrency:
  group: checkout-v6-staging-deploy
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'pixmcp-cloud/pote-batata-pro-v6-site' && github.ref == 'refs/heads/feat/v6-geoapify-qa-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: workers/antifraud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/firebase-probe.test.mjs test/firebase-commercial-preflight.test.mjs test/checkout_worker.test.mjs
      - name: Confirmar destino, segredos e flags sem ler valores secretos
        run: |
          node --input-type=module <<'NODE'
          const r=await fetch("https://api.cloudflare.com/client/v4/accounts/"+process.env.CLOUDFLARE_ACCOUNT_ID+"/workers/scripts/pote-batata-checkout-v6-staging/settings",{headers:{Authorization:"Bearer "+process.env.CLOUDFLARE_API_TOKEN},redirect:"error",signal:AbortSignal.timeout(15000)});
          const b=await r.json(),a=b.result?.bindings;if(!r.ok||!b.success||!Array.isArray(a))throw Error("SETTINGS_UNKNOWN");
          if(!["GCP_CLIENT_EMAIL","GCP_PRIVATE_KEY"].every(name=>a.some(x=>x.name===name&&x.type==="secret_text")))throw Error("SECRETS_NOT_PRESENT");
          if(!Object.entries({ENABLE_CHECKOUT:"false",ENABLE_TRACKING:"false",CHECKOUT_CANARY_UIDS:"",REQUIRE_LEGAL_TERMS:"true"}).every(([name,value])=>a.some(x=>x.name===name&&x.type==="plain_text"&&x.text===value)))throw Error("FLAGS_NOT_LOCKED");
          NODE
          grep -Fx 'name = "pote-batata-checkout-v6-staging"' wrangler.checkout-v6.qa.toml
          grep -Fx 'ENABLE_CHECKOUT = "false"' wrangler.checkout-v6.qa.toml
          grep -Fx 'ENABLE_TRACKING = "false"' wrangler.checkout-v6.qa.toml
          grep -Fx 'CHECKOUT_CANARY_UIDS = ""' wrangler.checkout-v6.qa.toml
      - name: Gerar desafio temporário para a próxima etapa
        run: |
          node --input-type=module <<'NODE'
          import {randomBytes,createHash} from "node:crypto";
          import {writeFileSync,appendFileSync} from "node:fs";
          const proof=randomBytes(32).toString("hex");
          console.log("::add-mask::"+proof);
          writeFileSync(process.env.RUNNER_TEMP+"/firebase-probe-proof",proof,{mode:0o600});
          appendFileSync(process.env.GITHUB_ENV,"PROBE_HASH="+createHash("sha256").update(proof).digest("hex")+"\nPROBE_EXPIRES="+(Date.now()+540000)+"\n");
          NODE
      - name: Implantar diagnóstico temporário protegido por desafio e expiração
        id: deploy
        run: |
          [[ "$PROBE_HASH" =~ ^[a-f0-9]{64}$ ]] && [[ "$PROBE_EXPIRES" =~ ^[0-9]{13}$ ]] || exit 1
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          npx --no-install wrangler deploy --config wrangler.checkout-v6.qa.toml --var "FIREBASE_PROBE_HASH:$PROBE_HASH" --var "FIREBASE_PROBE_EXPIRES:$PROBE_EXPIRES"
      - name: Confirmar publicação do desafio por metadados sem revelar valores
        run: |
          node --input-type=module <<'NODE'
          const r=await fetch("https://api.cloudflare.com/client/v4/accounts/"+process.env.CLOUDFLARE_ACCOUNT_ID+"/workers/scripts/pote-batata-checkout-v6-staging/settings",{headers:{Authorization:"Bearer "+process.env.CLOUDFLARE_API_TOKEN},redirect:"error",signal:AbortSignal.timeout(15000)});
          const b=await r.json(),a=b.result?.bindings;
          if(!r.ok||!b.success||!Array.isArray(a))throw Error("SETTINGS_UNKNOWN");
          if(!a.some(x=>x.name==="FIREBASE_PROBE_HASH"&&x.text===process.env.PROBE_HASH)||!a.some(x=>x.name==="FIREBASE_PROBE_EXPIRES"&&String(x.text)===process.env.PROBE_EXPIRES))throw Error("PROBE_BINDINGS_MISMATCH");
          console.log("PROBE_BINDINGS_VERIFIED");
          NODE
      - name: Testar OAuth e cinco índices no Worker real
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const proof=fs.readFileSync(process.env.RUNNER_TEMP+"/firebase-probe-proof","utf8"),base="https://pote-batata-checkout-v6-staging.pixmcp.workers.dev";
          const req=(path,opts={})=>fetch(base+path,{...opts,redirect:"error",signal:AbortSignal.timeout(90000)});
          if((await req("/internal/firebase-preflight",{method:"POST"})).status!==404)throw Error("UNAUTHENTICATED_PROBE_EXPOSED");
          let result;
          for(let i=0;i<10;i++){
           const r=await req("/internal/firebase-preflight",{method:"POST",headers:{"X-Firebase-Probe":proof}});
           if(r.status===404){await new Promise(r=>setTimeout(r,4000));continue;}
           if(!r.ok)throw Error("PROBE_HTTP_"+r.status);
           result=await r.json();break;
          }
          if(!result)throw Error("PROBE_NOT_PROPAGATED");
          // Only predefined readiness states; never return a token, secret or customer record.
          console.log("FIREBASE_LIVE_RESULT "+JSON.stringify(result));
          if(result.oauth!==true)console.log("FIREBASE_LIVE_AUTH_NOT_VERIFIED");
          else console.log("FIREBASE_LIVE_OAUTH_PASS");
          NODE
      - name: Desativar diagnóstico e preservar segredos
        if: always() && steps.deploy.outputs.attempted == 'true'
        run: |
          npx --no-install wrangler deploy --config wrangler.checkout-v6.qa.toml
          rm -f "$RUNNER_TEMP/firebase-probe-proof"
          node --input-type=module <<'NODE'
          const r=await fetch("https://api.cloudflare.com/client/v4/accounts/"+process.env.CLOUDFLARE_ACCOUNT_ID+"/workers/scripts/pote-batata-checkout-v6-staging/settings",{headers:{Authorization:"Bearer "+process.env.CLOUDFLARE_API_TOKEN},redirect:"error",signal:AbortSignal.timeout(15000)});
          const b=await r.json(),a=b.result?.bindings;if(!r.ok||!b.success||!Array.isArray(a))throw Error("SETTINGS_UNKNOWN");
          if(!["GCP_CLIENT_EMAIL","GCP_PRIVATE_KEY"].every(name=>a.some(x=>x.name===name&&x.type==="secret_text")))throw Error("SECRETS_NOT_PRESERVED");
          if(a.some(x=>["FIREBASE_PROBE_HASH","FIREBASE_PROBE_EXPIRES"].includes(x.name)))throw Error("PROBE_BINDINGS_NOT_REMOVED");
          if(!Object.entries({ENABLE_CHECKOUT:"false",ENABLE_TRACKING:"false",CHECKOUT_CANARY_UIDS:"",REQUIRE_LEGAL_TERMS:"true"}).every(([name,value])=>a.some(x=>x.name===name&&x.type==="plain_text"&&x.text===value)))throw Error("FLAGS_NOT_LOCKED");
          console.log("PROBE_REMOVED_SECRETS_PRESERVED_CHECKOUT_LOCKED");
          NODE
