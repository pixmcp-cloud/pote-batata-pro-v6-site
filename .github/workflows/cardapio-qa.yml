name: QA Cardápio V6
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cardapio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check public_menu_admin.mjs
          node --check floating_menu.js
          node --check cardapio/cardapio.js
          node test_cardapio_central.cjs
          node test_public_menu_core.mjs
          node test_cardapio_core.mjs
          node test_checkout_client.mjs
          node test_tracking_core.mjs
          node test_cardapio_images.cjs
          node test_cardapio_ingredients.cjs
          node test_cardapio_hero.cjs
      - name: Testar cardápio no Chrome antes do merge
        run: |
          set -e
          mkdir -p public/assets
          cp -R cardapio public/cardapio
          cp public_menu_core.mjs public/
          cp assets/pote-logo-original.jpg public/assets/
          cp -R assets/recipes assets/generic public/assets/
          npm ci --prefix qa/mobile --ignore-scripts --no-audit --no-fund
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          node test_cardapio_browser.cjs
