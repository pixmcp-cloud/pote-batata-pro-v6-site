name: B02.2 Checkout lab — sem deploy
on:
  push:
    branches: [feat/pdv-checkout-b021]
    paths:
      - 'checkout_backend/**'
      - 'firebase.checkout.lab.json'
      - 'workers/antifraud/src/checkout_auth_lab*'
      - 'workers/antifraud/src/firestore.mjs'
      - 'workers/antifraud/src/index.mjs'
      - 'v5_storage.mjs'
      - 'v5_store_core.mjs'
      - 'free_limits.mjs'
      - 'license_terms.mjs'
      - 'firebase_integration.js'
      - 'source/pote_app_base.html'
      - '.github/workflows/checkout-lab-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checkout-lab-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.8'
      - name: Testes do núcleo, adaptador e cronômetro
        run: |
          node checkout_backend/checkout_domain.test.mjs
          node checkout_backend/order_ticker.test.mjs
          node checkout_backend/firestore_checkout_lab.test.mjs
          node checkout_backend/checkout_client_lab.test.mjs
          node checkout_backend/pdv_checkout_queue.test.mjs
          node checkout_backend/checkout_http_lab.test.mjs
          node checkout_backend/v5_checkout_catalog_lab.test.mjs
          node checkout_backend/v5_checkout_authority_lab.test.mjs
          node checkout_backend/v5_checkout_b029.test.mjs
          node checkout_backend/v5_cutover_policy.test.mjs
          node checkout_backend/checkout_cash_b013.test.mjs
          node checkout_backend/stock_adjustment_lab.test.mjs
          node checkout_backend/checkout_recovery_lab.test.mjs
          node checkout_backend/checkout_access_lab.test.mjs
          node checkout_backend/v5_g4_lab.test.mjs
          node checkout_backend/v5_store_setup_lab.test.mjs
          node checkout_backend/v5_trial_downgrade_lab.test.mjs
          node checkout_backend/g9_grant_late_lab.test.mjs
      - name: Dependências fixadas do emulador
        run: |
          npm ci --prefix qa/firestore --ignore-scripts --no-audit --no-fund
          npm ci --prefix workers/antifraud --ignore-scripts --no-audit --no-fund
          npm ci --prefix qa/mobile --ignore-scripts --no-audit --no-fund
      - name: Verificação criptográfica de identidade sintética
        run: node workers/antifraud/src/checkout_auth_lab.test.mjs
      - name: Transações SDK e regras em projeto sintético local
        run: >-
          npx --yes --package=firebase-tools@15.36.0 firebase emulators:exec
          --only firestore --project demo-nucleobit-checkout --config firebase.checkout.lab.json
          "node checkout_backend/firestore_checkout_emulator.test.cjs && node checkout_backend/firestore_checkout_authority_emulator.test.cjs && node checkout_backend/v5_cutover_emulator.test.cjs && node checkout_backend/v5_integrated_emulator.test.cjs && node checkout_backend/v5_trial_rules_emulator.test.cjs"
      - name: Navegador e impressão da fila online (local)
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node checkout_backend/pdv_queue_preview.test.cjs
