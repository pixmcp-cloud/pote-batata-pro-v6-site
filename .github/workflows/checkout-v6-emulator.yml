name: V6 Checkout - transacao real no Firestore Emulator
on:
  push:
    branches: [feat/v6-geoapify-qa-20261125]
    paths:
      - 'workers/antifraud/src/checkout_transaction.mjs'
      - 'workers/antifraud/src/firestore.mjs'
      - 'test_firestore_checkout_v6.cjs'
      - '.github/workflows/checkout-v6-emulator.yml'
permissions:
  contents: read
jobs:
  checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.8'
      - run: npm ci --prefix qa/firestore --ignore-scripts
      - run: npm ci --prefix workers/antifraud --ignore-scripts --no-audit --no-fund
      - run: node --test workers/antifraud/test/delivery_policy.test.mjs workers/antifraud/test/public_checkout_core.test.mjs
      - run: >-
          npx --yes --package=firebase-tools@15.36.0 firebase emulators:exec
          --only firestore --project demo-pote-hardening --config firebase.emulator.qa.json
          "node --test --test-concurrency=1 test_firestore_checkout_v6.cjs"
