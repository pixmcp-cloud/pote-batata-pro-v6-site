name: Publicar V6 - demonstracao gratuita
on: [push, workflow_dispatch]
permissions: {contents: read, pages: write, id-token: write}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Preparar versão pública FREE
        run: |
          mkdir -p public
          curl --retry 3 --retry-delay 2 -fL "https://d2ol7oe51mr4n9.cloudfront.net/user_38IdAoySLpr0wvVak2GIe3bSQA5/eafa8b81-bf3c-4c92-a14f-a00a473610f9.html" -o public/index.html
          python3 sanitize_public.py public/index.html
          python3 -c 'import pathlib,re; s=pathlib.Path("public/index.html").read_text(); scripts=re.findall(r"<script[^>]*>(.*?)</script>",s,re.I|re.S); assert len(scripts)>=2; pathlib.Path("app-check.js").write_text(scripts[-1])'
          node --check app-check.js
          rm -f app-check.js
          test ! -e public/setup.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: public}
      - uses: actions/deploy-pages@v4
