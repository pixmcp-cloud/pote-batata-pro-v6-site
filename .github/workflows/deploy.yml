name: Publicar V6 e beta autenticado
on: [push, workflow_dispatch]
permissions: {contents: read, pages: write, id-token: write}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Preparar demonstracao e beta Firebase
        run: |
          mkdir -p public
          cp source/pote_app_base.html public/index.html
          cp firebase-bridge.html public/firebase-bridge.html
          python3 sanitize_public.py public/index.html
          python3 add_contacts.py public/index.html
          cp public/index.html public/beta.html
          python3 make_beta.py public/beta.html
          cp public/beta.html public/index.html
          mkdir -p public/assets
          cp assets/pote-logo-original.jpg public/assets/pote-logo-original.jpg
          cp firebase_integration.js public/firebase_integration.js
          cp supplier_integration.js public/supplier_integration.js
          cp simulation_panel.js public/simulation_panel.js
          cp simulation_panel.css public/simulation_panel.css
          cp mobile.css public/mobile.css
          cp floating_menu.css public/floating_menu.css
          cp image_responsive.css public/image_responsive.css
          cp admin_console.css public/admin_console.css
          cp admin_console.js public/admin_console.js
          cp license_terms.mjs public/license_terms.mjs
          cp floating_menu.js public/floating_menu.js
          cp visual_refresh.css public/visual_refresh.css
          cp dashboard_charts.js public/dashboard_charts.js
          cp recipe_images.js public/recipe_images.js
          cp -R assets/recipes public/assets/recipes
          cp -R assets/operations public/assets/operations
          python3 -c 'import pathlib,re; s=pathlib.Path("public/index.html").read_text(); scripts=[x for x in re.findall(r"<script[^>]*>(.*?)</script>",s,re.I|re.S) if x.strip()]; assert len(scripts)>=2; pathlib.Path("app-check.js").write_text(scripts[-1])'
          node --check app-check.js
          python3 -c 'import pathlib,re; s=pathlib.Path("public/beta.html").read_text(); scripts=[x for x in re.findall(r"<script[^>]*>(.*?)</script>",s,re.I|re.S) if x.strip()]; assert len(scripts)>=2; pathlib.Path("app-check.js").write_text(scripts[-1])'
          node --check app-check.js
          node --input-type=module --check < public/firebase_integration.js
          node --check public/supplier_integration.js
          node test_suppliers.js
          node --check public/simulation_panel.js
          node --check public/dashboard_charts.js
          node test_dashboard_charts.js
          node test_clean_accounts.js
          node test_responsive_images.js
          node --check public/license_terms.mjs
          node --input-type=module --check < public/admin_console.js
          node test_admin_licenses.mjs
          grep -q 'supplier_integration.js' public/index.html
          grep -q 'simulation_panel.js' public/index.html
          grep -q 'simulation_panel.css' public/index.html
          grep -q 'poteFreshAccount' public/index.html
          grep -q 'mobile.css' public/index.html
          grep -q 'id="poteSyncStatus"' public/index.html
          rm -f app-check.js
          test ! -e public/setup.html
          grep -q "poteAuthGate" public/beta.html
          grep -q "poteAuthGate" public/index.html
          test -f public/assets/pote-logo-original.jpg
          grep -q "firebase_integration.js" public/beta.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: public}
      - uses: actions/deploy-pages@v4
