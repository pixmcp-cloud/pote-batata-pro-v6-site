      # Reutiliza o mesmo runner do deploy: sem segundo servidor, serviço pago
      # ou espera manual. Falhas na emulação impedem publicação.
      - name: Emular 8 telas Android Chrome, PDV, backup e franquias
        run: |
          set -e
          npm ci --prefix qa/mobile --ignore-scripts --no-audit --no-fund
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME_BIN" ]; then echo "Chrome não disponível no runner"; exit 1; fi
          export POTE_QA_PUPPETEER="$PWD/qa/mobile/node_modules/puppeteer-core"
          export POTE_QA_CHROME="$CHROME_BIN"
          node test_admin_feedback_popup_browser.cjs
          node qa/mobile/test_mobile_matrix.cjs
          node qa/mobile/test_franchise_mobile.cjs
          node test_hardening_mobile_browser.cjs
