name: Verificar regras do Firestore

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.8'
      - name: Instalar dependências dos testes
        run: npm ci --prefix qa/firestore --ignore-scripts
      - name: Verificar regras, concorrência e restauração no projeto demo
        run: >-
          npx --yes --package=firebase-tools@15.36.0 firebase emulators:exec
          --only firestore --project demo-pote-hardening --config firebase.emulator.qa.json
          "node --test --test-concurrency=1 test_firestore_rules_emulator.cjs test_firestore_f02_atomic_guard.cjs test_firestore_f02_multistock.cjs test_firestore_cash_event_fields.cjs test_firestore_stock_nonnegative.cjs test_firestore_v2_live_concurrency.cjs test_firestore_f06_bulk.cjs test_firestore_f10_migration.cjs test_firestore_franchise_report.cjs test_firestore_v2_backup_restore.cjs"
      - name: Verificar regras candidatas e cotas no projeto demo
        env:
          POTE_HARDENED_RULES: '1'
        run: >-
          npx --yes --package=firebase-tools@15.36.0 firebase emulators:exec
          --only firestore --project demo-pote-hardening --config firebase.hardened.qa.json
          "node --test --test-concurrency=1 test_firestore_rules_emulator.cjs test_firestore_f02_atomic_guard.cjs test_firestore_f02_multistock.cjs test_firestore_cash_event_fields.cjs test_firestore_stock_nonnegative.cjs test_firestore_f06_bulk.cjs test_firestore_quota_singleton.cjs test_firestore_free_client.cjs test_firestore_f10_migration.cjs test_firestore_franchise_report.cjs test_firestore_v2_legacy_compatibility.cjs"
