name: Verificar regras unificadas V5 no Firestore

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.8'
      - name: Instalar dependências dos testes
        run: npm ci --prefix qa/firestore --ignore-scripts
      - name: Instalar dependências do Worker para testes transacionais
        run: npm ci --prefix workers/antifraud --ignore-scripts --no-audit --no-fund
      - name: Testar Worker F05 V5 isolado — sem segredos nem escrita externa
        run: |
          npm run check --prefix workers/antifraud
          npm test --prefix workers/antifraud
          node test_f05_worker_staging_contract.cjs
      - name: Verificar regras, concorrência e restauração no projeto demo
        run: >-
          npx --yes --package=firebase-tools@15.36.0 firebase emulators:exec
          --only firestore --project demo-pote-hardening --config firebase.emulator.qa.json
          "node --test --test-concurrency=1 test_firestore_v5_emulator.cjs test_firestore_v5_multistock.cjs test_firestore_v5_e2e.cjs test_firestore_worker_v5_rest_e2e.cjs test_firestore_profile_moderation.cjs test_firestore_free_segment.cjs test_firestore_public_menu_emulator.cjs"
      - name: F05 — executar corte canário em regras isoladas e Worker REST integrado
        env:
          POTE_F05_CUTOVER_RULES: '1'
        run: >-
          npx --yes --package=firebase-tools@15.36.0 firebase emulators:exec
          --only firestore --project demo-pote-hardening --config firebase.f05-cutover.qa.json
          "node --test --test-concurrency=1 test_firestore_f05_cutover.cjs test_firestore_worker_v5_rest_e2e.cjs test_f05_canary_rollout_emulated.cjs test_firestore_free_segment.cjs"
      - name: Verificar regras candidatas e cotas no projeto demo
        env:
          POTE_HARDENED_RULES: '1'
        run: >-
          npx --yes --package=firebase-tools@15.36.0 firebase emulators:exec
          --only firestore --project demo-pote-hardening --config firebase.hardened.qa.json
          "node --test --test-concurrency=1 test_firestore_v5_emulator.cjs test_firestore_v5_multistock.cjs test_firestore_v5_e2e.cjs test_firestore_worker_v5_rest_e2e.cjs test_firestore_profile_moderation.cjs test_firestore_free_segment.cjs test_firestore_public_menu_emulator.cjs"
