name: V6 Geoapify - promover correções homologadas para staging bloqueado
on:
  push:
    branches: [feat/v6-geoapify-qa-20261125]
    paths: ['.github/workflows/geo-staging-promote-qa.yml']
permissions:
  contents: read
concurrency:
  group: pote-batata-geo-staging-bootstrap
  cancel-in-progress: false
jobs:
  promote:
    if: github.repository == 'pixmcp-cloud/pote-batata-pro-v6-site' && github.ref == 'refs/heads/feat/v6-geoapify-qa-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/antifraud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validar código e destino isolado
        run: |
          node --test test/geo_*.test.mjs test/public_checkout_core.test.mjs
          grep -Fx 'name = "pote-batata-geo-staging"' wrangler.geoapify.toml
          grep -Fx 'ENABLE_GEO = "false"' wrangler.geoapify.toml
          grep -Fx 'GEO_CANARY_UIDS = ""' wrangler.geoapify.toml
          npx --no-install wrangler deploy --config wrangler.geoapify.toml --dry-run --outdir .wrangler/geo-qa
      - name: Conferir staging existente bloqueado e segredo instalado
        run: |
          node --input-type=module <<'NODE'
          const r=await fetch("https://pote-batata-geo-staging.pixmcp.workers.dev/health",{redirect:"error",signal:AbortSignal.timeout(10000)});
          const b=await r.json();if(!r.ok||b.enabled!==false||b.checkoutEnabled!==false)throw Error("Staging inesperado");
          NODE
          npx --no-install wrangler secret list --config wrangler.geoapify.toml > "$RUNNER_TEMP/geo-before.json"
          node --input-type=module -e 'import fs from "node:fs"; if(!JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/geo-before.json","utf8")).some(x=>x.name==="GEOAPIFY_API_KEY"))throw Error("Secret ausente");'
      - name: Publicar correções homologadas apenas no staging
        run: npx --no-install wrangler deploy --config wrangler.geoapify.toml
      - name: Verificar segurança e segredo depois da atualização
        run: |
          npx --no-install wrangler secret list --config wrangler.geoapify.toml > "$RUNNER_TEMP/geo-after.json"
          node --input-type=module -e 'import fs from "node:fs";if(!JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/geo-after.json","utf8")).some(x=>x.name==="GEOAPIFY_API_KEY"))throw Error("Secret não preservado");console.log("GEO_SECRET_PRESERVED");'
          node --input-type=module <<'NODE'
          const base="https://pote-batata-geo-staging.pixmcp.workers.dev";
          const req=(p,opts={})=>fetch(base+p,{...opts,redirect:"error",signal:AbortSignal.timeout(12000)});
          const r=await req("/health"),b=await r.json();
          if(!r.ok||b.status!=="ok"||b.enabled!==false||b.checkoutEnabled!==false)throw Error("Staging não bloqueado");
          const q=await req("/v1/geo/quote",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
          if(q.status!==423||(await q.json()).error!=="geo_disabled")throw Error("Cotação desbloqueada");
          if((await req("/health",{headers:{Origin:"https://evil.example"}})).status!==403)throw Error("Origem indevida");
          if((await req("/v1/orders/create",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})).status!==404)throw Error("Checkout exposto");
          console.log("CORRECTED_STAGING_LOCKED_AND_HEALTHY");
          NODE
