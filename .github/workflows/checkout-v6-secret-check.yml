name: V6 Checkout - conferir segredos existentes sem alteração
on:
  push:
    branches: [feat/v6-geoapify-qa-20261125]
    paths: ['.github/workflows/checkout-v6-secret-check.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'pixmcp-cloud/pote-batata-pro-v6-site' && github.ref == 'refs/heads/feat/v6-geoapify-qa-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Consultar somente metadados de segredos e travas
        run: |
          node --input-type=module <<'NODE'
          const api="https://api.cloudflare.com/client/v4/accounts/"+process.env.CLOUDFLARE_ACCOUNT_ID+"/workers/scripts/pote-batata-checkout-v6-staging";
          const r=await fetch(api+"/settings",{headers:{Authorization:"Bearer "+process.env.CLOUDFLARE_API_TOKEN},redirect:"error",signal:AbortSignal.timeout(15000)});
          const b=await r.json();if(!r.ok||!b.success||!Array.isArray(b.result?.bindings))throw Error("WORKER_SETTINGS_NOT_VERIFIED");
          const a=b.result.bindings;
          for(const name of ["GCP_CLIENT_EMAIL","GCP_PRIVATE_KEY"]){const x=a.find(x=>x.name===name);console.log(name+"_"+(!x?"MISSING":x.type==="secret_text"?"SECRET_PRESENT":"NOT_SECRET"));}
          const flags={ENABLE_CHECKOUT:"false",ENABLE_TRACKING:"false",CHECKOUT_CANARY_UIDS:"",REQUIRE_LEGAL_TERMS:"true"};
          if(!Object.entries(flags).every(([name,value])=>a.some(x=>x.name===name&&x.type==="plain_text"&&x.text===value)))throw Error("WORKER_FLAGS_UNVERIFIED");
          const h=await fetch("https://pote-batata-checkout-v6-staging.pixmcp.workers.dev/health",{redirect:"error",signal:AbortSignal.timeout(12000)});
          const health=await h.json();if(!h.ok||health.checkoutEnabled!==false||health.trackingEnabled!==false)throw Error("WORKER_HEALTH_UNVERIFIED");
          console.log("CHECKOUT_LOCKED");
          if(!["GCP_CLIENT_EMAIL","GCP_PRIVATE_KEY"].every(name=>a.some(x=>x.name===name&&x.type==="secret_text")))throw Error("TWO_SECRET_BINDINGS_NOT_CONFIRMED");
          console.log("BOTH_SECRET_BINDINGS_PRESENT_VALUES_NOT_READ");
          NODE
