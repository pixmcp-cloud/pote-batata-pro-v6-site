name: V6 Entregas Geoapify - testes e build sem deploy
on:
  push:
    branches: [feat/v6-geoapify-qa-20261125]
  pull_request:
    paths:
      - 'workers/antifraud/src/geo_*.mjs'
      - 'workers/antifraud/test/geo_*.test.mjs'
      - 'workers/antifraud/wrangler.geoapify.toml'
      - 'cardapio/**'
      - '.github/workflows/geo-delivery-qa.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: workers/antifraud
      - run: node --test test/geo_*.test.mjs
        working-directory: workers/antifraud
      - run: npx wrangler deploy --config wrangler.geoapify.toml --dry-run --outdir .wrangler/geo-qa
        working-directory: workers/antifraud
      - run: grep -q 'ENABLE_GEO = "false"' workers/antifraud/wrangler.geoapify.toml
      - run: node test_cardapio_core.mjs
      - run: node --test cardapio/delivery-client.test.mjs
      - run: node --check cardapio/cardapio.js && node --check public_menu_admin.mjs
      - name: Verificar credenciais de implantação Cloudflare (sem exibir valores)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CF_TOKEN || "";
          const account = process.env.CF_ACCOUNT || "";
          const accountOK = /^[a-fA-F0-9]{32}$/.test(account);
          console.log("CF_ACCOUNT_ID_" + (accountOK ? "FORMAT_OK" : account ? "INVALID_FORMAT" : "MISSING"));
          console.log("CF_API_TOKEN_" + (token ? "PRESENT" : "MISSING"));
          if (!token || !accountOK) {
            console.log("CF_WORKERS_AUTH_NOT_TESTED");
          } else {
            try {
              const r = await fetch("https://api.cloudflare.com/client/v4/accounts/" + account + "/workers/scripts", {
                headers: { Authorization: "Bearer " + token },
                redirect: "error", signal: AbortSignal.timeout(15000)
              });
              const body = await r.json().catch(() => ({}));
              console.log("CF_WORKERS_AUTH_HTTP_" + r.status);
              console.log("CF_WORKERS_AUTH_" + (r.ok && body.success === true ? "OK" : "FAILED"));
            } catch {
              console.log("CF_WORKERS_AUTH_NETWORK_ERROR");
            }
          }
          NODE
      - run: node --test test/public_checkout_core.test.mjs
        working-directory: workers/antifraud
      - run: node --test test/delivery_policy.test.mjs
        working-directory: workers/antifraud
      - run: node --test test/checkout_worker.test.mjs
        working-directory: workers/antifraud
      - run: npx wrangler deploy --config wrangler.checkout-v6.qa.toml --dry-run --outdir .wrangler/checkout-qa
        working-directory: workers/antifraud
      - run: node --test cardapio/checkout-api.test.mjs
      - run: node --check cardapio/customer-orders.mjs && node --check cardapio/cardapio.js && node --check receipt_enhanced.js

      - run: node --test cardapio/courier-stop.test.mjs && node --check cardapio/courier-delivery.mjs

      - run: node --test cardapio/courier-safety.test.mjs && node --check cardapio/courier-delivery.mjs && node --check notifications.js

      - run: node --check legal_core.mjs && node --check legal_ui.mjs && node --input-type=module --check < firebase_integration.js

      - run: node --test test/firebase-commercial-preflight.test.mjs
        working-directory: workers/antifraud
