<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NÚCLEOBIT | Cardápio de laboratório</title><link rel="stylesheet" href="./order_ticker.css"><style>
*{box-sizing:border-box}body{margin:0;background:#101925;color:#f6f8fb;font:16px system-ui,sans-serif}main{max-width:680px;margin:auto;padding:18px 16px 90px}h1{font-size:26px;margin:8px 0}small{color:#c8d8e8}article,section{background:#1c2b3d;border:1px solid #354b63;border-radius:12px;padding:14px;margin:12px 0}button,input,select{font:inherit;color:inherit;background:#24384e;border:1px solid #58738e;border-radius:8px;padding:10px;min-height:44px;max-width:100%}button{cursor:pointer}button:disabled{opacity:.5}button.primary{background:#006d9d}label{display:block;margin:10px 0}label input,label select{display:block;margin-top:4px;width:100%}article input{width:90px}#feedback{min-height:30px;overflow-wrap:anywhere}#ticker{bottom:0;z-index:5}[hidden]{display:none!important}
</style></head><body><main><small>VITRINE DE LABORATÓRIO • PRODUTOS FICTÍCIOS</small><h1>Cardápio digital</h1><p>Escolha seu pedido. A identificação é solicitada apenas para comprar ou consultar uma tentativa.</p><div id="products"></div><section><label>Recebimento<select id="fulfillment"><option value="pickup">Retirada no local</option><option value="delivery">Tele-entrega</option></select></label><label id="address-label" hidden>Endereço<input id="address" maxlength="220"></label><label>Pagamento<select id="method"><option value="pix">PIX</option><option value="cash">Dinheiro</option><option value="card">Cartão</option></select></label><button id="quote" class="primary">Conferir pedido</button> <button id="submit" disabled>Confirmar pedido</button><p id="quote-total"></p><button id="recover">Consultar tentativa anterior</button> <button id="retry-order" hidden>Repetir mesma confirmação</button><p id="feedback" role="status" aria-live="polite"></p><button id="logout" hidden>Sair da conta de teste</button></section></main><footer id="ticker" hidden></footer><script type="module" src="./customer_menu_lab.mjs"></script></body></html>
