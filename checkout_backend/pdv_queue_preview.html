<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NÚCLEOBIT | Fila online — laboratório</title>
<style>
:root{color-scheme:dark;--bg:#10151d;--panel:#1b2532;--text:#f4f7fb;--muted:#aebccd;--accent:#6ed9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:20px}header{border-bottom:1px solid #344456;padding-bottom:15px}h1{font-size:24px;margin:8px 0}h2{font-size:18px}p{color:var(--muted)}.tag{font-size:12px;color:#f5cc7a}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.card,article{background:var(--panel);padding:15px;border:1px solid #344456;border-radius:12px}.card small{display:block;color:var(--muted);margin-bottom:8px}.card strong{font-size:20px}.queue{display:grid;gap:10px}article h3{margin:0 0 8px}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input{font:inherit;border:1px solid #49627b;border-radius:8px;padding:10px;color:var(--text);background:#24374b}button{cursor:pointer;min-height:44px}button:focus-visible,input:focus-visible{outline:2px solid var(--accent)}button:disabled{opacity:.5;cursor:not-allowed}input{max-width:100%;width:260px}button[data-primary]{background:#057baf;color:white}.receipt{white-space:pre-wrap;font:13px monospace;padding:12px;max-width:80mm;color:#111;background:white}.status{color:var(--accent)}@media print{body{background:white;color:black}main>*:not(#receipt){display:none!important}#receipt{display:block!important;margin:0;padding:0;max-width:80mm}.receipt{padding:0}}
dialog{background:var(--panel);color:var(--text);border:1px solid #49627b;border-radius:12px;width:min(90vw,440px);max-height:90vh;overflow:auto}dialog label{display:block;margin:10px 0}dialog input,dialog select{display:block;width:100%;padding:10px;margin-top:4px;background:#24374b;color:var(--text);border:1px solid #49627b;border-radius:8px}dialog::backdrop{background:#000a}</style></head><body><main><header><span class="tag">LABORATÓRIO • DADOS FICTÍCIOS • SEM CONEXÃO EXTERNA</span><h1>PDV NÚCLEOBIT</h1><p>Fila de pedidos online e recebimentos</p></header><h2>Caixa online</h2><section class="cards" id="cash"></section><p><button id="close-shift">Encerrar turno de teste</button> <button id="new-shift" hidden>Abrir novo turno de teste</button></p><p><label>Prazo de novos pedidos (minutos) <input id="reservation-minutes" type="number" min="5" max="120" step="1" value="30"></label></p><h2>Pedidos</h2><div id="feedback" role="status" aria-live="polite"></div><section class="queue" id="queue"></section><section id="receipt" hidden><h2>Comprovante</h2><pre class="receipt" id="receipt-text"></pre><button id="print">Imprimir comprovante</button></section><dialog id="reconcile-dialog"><form id="reconcile-form"><h2>Conciliar cancelamento</h2><p>Somente registro de teste. Nenhum dinheiro será transferido.</p><label>Motivo <input id="reconcile-reason" required maxlength="220"></label><label>Estoque <select id="reconcile-decision"><option value="return">Repor reserva intacta</option><option value="loss">Registrar perda</option></select></label><label>Referência de estorno externo <input id="reconcile-ref" maxlength="120"></label><p id="reconcile-error" role="alert"></p><button id="reconcile-submit" type="submit">Confirmar conciliação</button> <button id="reconcile-close" type="button">Voltar</button></form></dialog></main><script type="module" src="./pdv_queue_preview.mjs"></script></body></html>
