<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NÚCLEOBIT | Operações — laboratório</title><link rel="stylesheet" href="./order_ticker.css"><style>
:root{color-scheme:dark;--bg:#0c1420;--panel:#182535;--line:#354b63;--accent:#74d7ff;--muted:#b9c9da}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f7fc;font:15px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:16px 16px 75px}header{border-bottom:1px solid var(--line);padding-bottom:12px}h1{font-size:25px;margin:6px 0}h2{font-size:19px;margin:8px 0 14px}.lab{color:#ffdb92;font-size:12px}nav,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button,input,select{font:inherit;border:1px solid #506780;border-radius:8px;padding:10px;background:#24364a;color:inherit;max-width:100%;min-height:44px}button{cursor:pointer}button[aria-selected=true],button.primary{background:#006d9d;color:white}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent)}[hidden]{display:none!important}section.panel,article,.metric{background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:12px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.metric small{display:block;color:var(--muted);margin-bottom:6px}.metric strong{font-size:19px}.muted{color:var(--muted)}label{display:block;margin:10px 0}label input,label select{display:block;width:100%;margin-top:5px}.product{display:flex;gap:12px;align-items:center;justify-content:space-between}.product input{width:75px}#feedback{min-height:26px;color:var(--accent);overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;color:#111;padding:12px;max-width:80mm}#ticker{bottom:0;z-index:5}#queue article{overflow-wrap:anywhere}dialog{width:min(92vw,430px);max-height:90vh;background:var(--panel);color:white;border:1px solid var(--line);border-radius:12px}dialog::backdrop{background:#000a}@media print{body{background:white;color:black}main>*:not(#receipt),#ticker{display:none!important}#receipt:not([hidden]){display:block!important}#receipt button{display:none}} </style></head><body><main><header><span class="lab">LABORATÓRIO LOCAL • DADOS FICTÍCIOS • NÃO É O PDV OFICIAL</span><h1>PDV NÚCLEOBIT</h1><div class="muted">Central de operações integrada</div></header>
<nav aria-label="Operações"><button id="tab-counter" data-tab="counter" aria-selected="true">Balcão</button><button id="tab-online" data-tab="online" aria-selected="false">Cardápio cliente</button><button id="tab-queue" data-tab="queue" aria-selected="false">Pedidos</button><button id="tab-cash" data-tab="cash" aria-selected="false">Caixa</button></nav>
<div id="feedback" role="status" aria-live="polite"></div>
<section class="panel" id="sale"><h2 id="sale-title">Venda de balcão</h2><div id="products"></div><label>Pagamento<select id="method"><option value="cash">Dinheiro</option><option value="pix">PIX</option><option value="card">Cartão</option></select></label><div class="actions"><button id="quote" class="primary">Conferir pedido</button><button id="submit" disabled>Confirmar pedido</button></div><div id="quote-total"></div><p id="customer-note" class="muted" hidden>Identidade de comprador fictícia, usada somente na homologação local.</p></section>
<section class="panel" id="orders" hidden><h2>Pedidos dos dois canais</h2><button id="refresh">Atualizar fila</button><p id="stock"></p><div id="queue"></div></section>
<section class="panel" id="cash" hidden><h2>Caixa integrado</h2><div class="grid" id="metrics"></div><div class="actions"><button id="open" data-cash="open">Abrir caixa</button><button id="supply" data-cash="suprimento">Suprimento</button><button id="withdraw" data-cash="sangria">Retirada (sangria)</button><button id="close" data-cash="close">Fechar caixa</button></div><div id="closed-summary"></div></section>
<section id="receipt" hidden><h2>Comprovante não fiscal</h2><pre id="receipt-text"></pre><button id="print">Imprimir</button></section>
<dialog id="cash-dialog"><form id="cash-form"><h2 id="cash-title"></h2><label>Valor em reais<input id="cash-amount" type="text" inputmode="decimal" required placeholder="0,00"></label><label id="cash-reason-label">Motivo<input id="cash-reason" maxlength="220"></label><button id="cash-confirm" type="submit" class="primary">Confirmar</button> <button id="cash-cancel" type="button">Voltar</button><p id="cash-error" role="alert"></p></form></dialog>
</main><footer id="ticker" hidden></footer><script type="module" src="./pdv_integrated_lab.mjs"></script></body></html>
